name: Verify receipts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python backend
        run: pip install cryptography
      - name: Verify receipts (Python reference implementation)
        run: python3 receipt.py list receipts/
      - name: Verify receipts (Node implementation) + pinned key + chain
        run: node verify.mjs --key keys/auroraxo.pub --chain chain.json receipts/
